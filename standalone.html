<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowMitra - AI agents built for by your team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Design Tokens */
        :root {
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --color-text-primary: #0a0a0a;
            --color-text-secondary: #525252;
            --color-background: #ffffff;
            --color-surface: #fafafa;
            --color-border: #e5e5e5;
            --color-primary: #000000;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-6: 24px;
            --space-8: 32px;
            --space-12: 48px;
            --space-16: 64px;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            color: var(--color-text-primary);
            background: var(--color-background);
            overflow-x: hidden;
        }

        /* Navigation */
        .navigation {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--color-border);
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 var(--space-6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text-primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: var(--space-6);
        }

        .nav-links a {
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-secondary);
            text-decoration: none;
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }

        .nav-links a:hover {
            color: var(--color-text-primary);
            background: var(--color-surface);
        }

        .nav-actions {
            display: flex;
            gap: var(--space-3);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            font-size: 14px;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--color-text-primary);
            border: 1px solid var(--color-border);
        }

        .announcement-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            padding: var(--space-3);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 12px;
            font-weight: 500;
        }

        .banner-badge {
            background: rgba(255, 255, 255, 0.25);
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 10px;
        }

        /* Hero */
        .hero {
            position: relative;
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-16) var(--space-6);
            background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
            overflow: hidden;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 900px;
            text-align: center;
        }

        .hero-title {
            font-size: 64px;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: var(--space-6);
        }

        .hero-title-highlight {
            position: relative;
            display: inline-block;
        }

        .hero-title-highlight::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 8px;
            height: 12px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            opacity: 0.3;
            z-index: -1;
        }

        .hero-subtitle {
            font-size: 20px;
            color: var(--color-text-secondary);
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .hero-actions {
            display: flex;
            gap: var(--space-4);
            justify-content: center;
        }

        .btn-large {
            font-size: 16px;
            padding: 14px 28px;
        }

        /* Floating Icons */
        .floating-icon {
            position: absolute;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-25px) rotate(2deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(25px) rotate(-2deg); }
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            background: white;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .icon-circle:hover {
            transform: scale(1.1) translateY(-4px);
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 32px; }
            .hero-subtitle { font-size: 16px; }
            .hero-actions { flex-direction: column; width: 100%; }
            .btn { width: 100%; }
            .nav-links, .nav-actions { display: none; }
            .floating-icon { display: none; }
        }
    </style>
</head>
<body>
    <nav class="navigation">
        <div class="nav-content">
            <a href="/" class="logo">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                    <rect width="32" height="32" rx="6" fill="currentColor" opacity="0.1"/>
                    <path d="M16 8L24 16L16 24L8 16L16 8Z" fill="currentColor"/>
                </svg>
                <span>FlowMitra</span>
            </a>
            <div class="nav-links">
                <a href="#solutions">Solutions</a>
                <a href="#resources">Resources</a>
                <a href="#enterprise">Enterprise</a>
                <a href="#pricing">Pricing</a>
            </div>
            <div class="nav-actions">
                <a href="#sales" class="btn btn-secondary">Talk to Sales</a>
                <a href="#start" class="btn btn-primary">Get Started</a>
            </div>
        </div>
        <div class="announcement-banner">
            <span class="banner-badge">NEW</span>
            <span>We raised a $50M Series B led by Benchmark</span>
        </div>
    </nav>

    <section class="hero">
        <!-- Floating Icons -->
        <div class="floating-icon" style="top: 15%; left: 8%; animation-delay: 0s;">
            <div class="icon-circle" style="color: #EA4335;">M</div>
        </div>
        <div class="floating-icon" style="top: 10%; left: 20%; animation-delay: 0.4s;">
            <div class="icon-circle" style="color: #4A154B;">S</div>
        </div>
        <div class="floating-icon" style="top: 35%; left: 5%; animation-delay: 0.6s;">
            <div class="icon-circle" style="color: #6264A7;">T</div>
        </div>
        <div class="floating-icon" style="bottom: 25%; left: 10%; animation-delay: 0.8s;">
            <div class="icon-circle" style="color: #FFE01B;">M</div>
        </div>
        <div class="floating-icon" style="top: 12%; right: 8%; animation-delay: 0.3s;">
            <div class="icon-circle" style="color: #4285F4;">▲</div>
        </div>
        <div class="floating-icon" style="top: 30%; right: 5%; animation-delay: 0.7s;">
            <div class="icon-circle" style="color: #FF7A59;">H</div>
        </div>
        <div class="floating-icon" style="bottom: 20%; right: 8%; animation-delay: 1.1s;">
            <div class="icon-circle" style="color: #29B5E8;">❄</div>
        </div>

        <div class="hero-content">
            <h1 class="hero-title">
                AI agents built<br>
                <span class="hero-title-highlight">for</span> by your team
            </h1>
            <p class="hero-subtitle">
                Understanding a task should be the only prerequisite to automating it.
            </p>
            <div class="hero-actions">
                <a href="#start" class="btn btn-primary btn-large">Get Started</a>
                <a href="#sales" class="btn btn-secondary btn-large">Talk to Sales</a>
            </div>
        </div>
    </section>
</body>
</html>
