<!doctype html>
<html lang="en" class="light" data-scroll-behavior="smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="canonical" href="https://workflowmitra-docs.vercel.app/" />

    <!-- DNS Prefetch & Preconnect for external font domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Geist & Geist Mono Google Fonts with swap display -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Default SEO (overridden by react-helmet-async per page) -->
    <title>Workflow Mitra Documentation | No-Code Automation Help Center</title>
    <meta
      name="description"
      content="Official production documentation for Workflow Mitra. Learn how to configure credentials, visual workflow nodes, webhooks, and AI integrations."
    />
    <meta
      name="keywords"
      content="Workflow Mitra, Documentation, No-Code, Automation, OpenAI, HubSpot, Slack, Webhooks"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Workflow Mitra Team" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Workflow Mitra Documentation" />
    <meta property="og:url" content="https://workflowmitra-docs.vercel.app" />
    <meta property="og:title" content="Workflow Mitra Documentation | No-Code Automation Help Center" />
    <meta
      property="og:description"
      content="Official production documentation for Workflow Mitra. Learn how to configure credentials, visual workflow nodes, webhooks, and AI integrations."
    />
    <meta property="og:image" content="https://workflowmitra-docs.vercel.app/images/logo.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@WorkflowMitra" />
    <meta name="twitter:title" content="Workflow Mitra Documentation | No-Code Automation Help Center" />
    <meta
      name="twitter:description"
      content="Official production documentation for Workflow Mitra. Learn how to configure credentials, visual workflow nodes, webhooks, and AI integrations."
    />
    <meta name="twitter:image" content="https://workflowmitra-docs.vercel.app/images/logo.webp" />

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Workflow Mitra",
        "url": "https://workflowmitra-docs.vercel.app",
        "logo": "https://workflowmitra-docs.vercel.app/images/logo.webp",
        "description": "No-code automation platform for building AI workflows",
        "sameAs": [
          "https://app.workflowmitra.com"
        ]
      }
    </script>
  </head>
  <body>
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-zinc-900 focus:text-white focus:rounded-lg focus:font-semibold dark:focus:bg-white dark:focus:text-zinc-900">
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
