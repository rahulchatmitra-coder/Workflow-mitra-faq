    <!-- Route-Aware LCP Image Preloader -->

      (function() {

            '/credentials/gemini': '/credentials/gemini/step1.webp'
          };
          var href = imgMap[p.toLowerCase()];
          if (href) {
            var l = document.createElement('link');
            l.rel = 'preload';
            l.as = 'image';
            l.href = href;
            l.fetchPriority = 'high';
            document.head.appendChild(l);
          }
