<!doctype html>
<html lang="en" class="light" data-scroll-behavior="smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Geist Sans Font (replaces next/font/google Geist) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Geist Mono Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Default SEO (overridden by react-helmet-async per page) -->
    <title>Workflow Mitra Documentation | No-Code Automation Help Center</title>
    <meta
      name="description"
      content="Official production documentation for Workflow Mitra. Learn how to configure credentials, visual workflow nodes, webhooks, and AI integrations."
    />
    <meta
      name="keywords"
      content="Workflow Mitra, Documentation, No-Code, Automation, OpenAI, HubSpot, Slack, Webhooks"
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Workflow Mitra Documentation" />
    <meta property="og:url" content="https://workflowmitra-docs.vercel.app" />
    <meta property="og:title" content="Workflow Mitra Documentation | No-Code Automation Help Center" />
    <meta
      property="og:description"
      content="Official production documentation for Workflow Mitra. Learn how to configure credentials, visual workflow nodes, webhooks, and AI integrations."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@WorkflowMitra" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
