<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="wmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with Border Glow -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="18" />

  <!-- Subtle Automation Circuit Connection Lines -->
  <circle cx="110" cy="110" r="7" fill="#38BDF8" opacity="0.5" />
  <circle cx="402" cy="110" r="7" fill="#818CF8" opacity="0.5" />
  <path d="M 110 110 L 256 70 L 402 110" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 6" opacity="0.3" fill="none" />

  <!-- Bold, Clean, Premium "WM" Vector Monogram -->
  <!-- W (Left Half) -->
  <path
    d="M 96 172 L 136 340 L 176 228 L 216 340 L 256 172"
    stroke="url(#wmGrad)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- M (Right Half) -->
  <path
    d="M 256 340 L 296 172 L 336 284 L 376 172 L 416 340"
    stroke="url(#wmGrad)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Glowing Automation Spark Nodes -->
  <circle cx="256" cy="172" r="18" fill="url(#sparkGrad)" filter="url(#glow)" />
  <circle cx="256" cy="172" r="8" fill="#FFFFFF" />
  <circle cx="96" cy="172" r="12" fill="#38BDF8" />
  <circle cx="416" cy="340" r="12" fill="#C084FC" />
</svg>
